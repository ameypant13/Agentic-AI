# Log-parser rules mined from the Prophecy codebase (SimpleDataLabsInc/prophecy, plus the
# sibling repos prophecy-orchestrate and prophecy-knowledge-graph where noted in `source`).
# Format: see FORMAT.md. `source` paths are relative to the prophecy repo root unless they
# start with "prophecy-orchestrate/" or "prophecy-knowledge-graph/".
version: 1

formats:
  # JVM services: logback generated by the operator (deployment/k8s/common/logback/template.go).
  # Default LOG_OUTPUT_FORMAT is json (logstash encoder); the text fallback starts with "[LEVEL]".
  - services: [app, edweb, execution, sparkedge, transpilerweb]
    example: '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","traceId":"4f1c2a9b","message":"Calling the copilot service failed","logger_name":"io.prophecy.core.copilot.client.CopilotClient","thread_name":"pool-5-thread-2"}'
    level: '(?:"level":"|^\[)(TRACE|DEBUG|INFO|WARN|ERROR)\b'
  # metagraph: LogbackTemplateMetagraph, text only (template.go:136).
  - services: [metagraph]
    example: '[ERROR][2026-10-08_10:58:13.551] P.GiteClient - Gitea is not coming up.'
    level: '^\[(TRACE|DEBUG|INFO|WARN|ERROR)\]\['
  # sandbox pods: Scala sandboxes get the operator JSON logback; Python sandboxes use
  # python-sandbox/helpers/customlogging.py:96 "[ts]::[LEVEL] ...".
  - services: [sandbox]
    example: '[2026-10-08 10:58:13,551]::[ERROR] [NA_session_id] [MainProcess] [MainThread] [artifactory.py:download:91]: - error in downloading package directly from nexus'
    level: '(?:"level":"|\]::\[)(TRACE|DEBUG|INFO|WARN|WARNING|ERROR|CRITICAL)\b'
  # sql sandbox pods (python-sandbox SQL_Sandbox image, supervisord): sql-sandbox/recycler use
  # customlogging.py text; agent-websocket/agent-rest-api use agent/core/logging_config.py JSON.
  - services: [sql]
    example: '{"timestamp": "2026-10-08T10:58:13.551442+00:00Z", "service": "agent-websocket", "level": "ERROR", "logger": "agent.services.claude_agent", "message": "upstream API error 429 not retried (cancelled=False, retries_used=3/3)"}'
    level: '(?:"level": "|\]::\[)(DEBUG|INFO|WARNING|ERROR|CRITICAL)\b'
  # athena: zap console encoder (deployment/k8s/prologger/zap/zap.go:66), tab separated.
  - services: [athena]
    example: "2026-10-08T10:58:13.551Z\terror\tbackup/backup.go:157\terror occurred while backup: exit status 1"
    level: '^\S+\s+(debug|info|warn|error|dpanic|panic|fatal)\s'
  # prophecy-operator (cp/go): operator-sdk zap, JSON production encoder (cmd/manager/main.go:81).
  - services: [cp-operator, go-operator]
    example: '{"level":"error","ts":1759921093.551,"logger":"reconciler lib","msg":"Update failed for : app-prophecy conflict","error":"conflict"}'
    level: '"level":"(debug|info|warn|error|dpanic|panic|fatal)"'
  # copilot: structlog (copilot/app/logger.py:134); default text "ts [level    ] msg", json opt-in.
  - services: [copilot]
    example: '2026-10-08T10:58:13.551442Z [error    ] LLM provider rejected the API key filename=aimodel.py lineno=887'
    level: '(?:^\S+ \[|"level": ")(debug|info|warning|error|critical)\b'
  # orchestrator (prophecy-orchestrate pkg/log/logger.go:101): zerolog JSON.
  - services: [orchestrator]
    example: '{"level":"error","service":"orchestrator","time":"2026-10-08T10:58:13.551234Z","caller":"/app/pkg/db/db.go:77","message":"Failed to open Postgres database: connection refused"}'
    level: '"level":"(trace|debug|info|warn|error|fatal|panic)"'
  # knowledgegraph (prophecy-knowledge-graph): Go zerolog JSON + Python sidecar "ts - knowledgegraph-service - LEVEL - msg".
  - services: [knowledgegraph]
    example: '{"error":"connection refused","level":"error","time":"2026-10-08T10:58:13.551442918Z","caller":"/app/go/internal/service/health_service.go:43","message":"error checking neo4j connectivity"}'
    level: '(?:"level":"| - knowledgegraph-service - )(debug|info|warn|error|fatal|panic|DEBUG|INFO|WARNING|ERROR|CRITICAL)\b'
  # openidfederator (dex fork): logrus TextFormatter to stderr (server serve.go:367).
  - services: [openidfederator]
    example: 'time="2026-10-08T10:58:13Z" level=error msg="failed to rotate keys: pq: connection refused"'
    level: '\blevel=(debug|info|warning|error|fatal|panic)\b'
  # gitserver: Gitea 1.12 console logger, default stdflags (containers/sdl-git/docker/etc/templates/app.ini:53).
  - services: [gitserver]
    example: '2026/10/08 10:58:13 routers/init.go:117:GlobalInit() [F] ORM engine initialization failed: connection refused'
    level: '^\S+ \S+ \S+ \[([TDIWEFC])\]'
  # artifactory: upstream Sonatype Nexus 3 logback (not in repo; upstream default).
  - services: [artifactory]
    example: '2026-10-08 10:58:13,551+0000 ERROR [jetty-main-1] *SYSTEM org.sonatype.nexus.bootstrap.jetty.JettyServer - Failed to start'
    level: '^\S+ \S+ (TRACE|DEBUG|INFO|WARN|ERROR)\s'
  # neo4j: upstream neo4j image default neo4j.log format.
  - services: [neo4j]
    example: '2026-10-08 10:58:13.551+0000 ERROR Failed to start Neo4j on 0.0.0.0:7474.'
    level: '^\S+ \S+ (DEBUG|INFO|WARN|ERROR)\s'
  # postgres (containers/postgres-sdl): PG16 default log_line_prefix '%m [%p] '. Note: the image runs
  # logging_collector=on (Dockerfile:15), so most server lines go to /app/logs/postgres, not kubectl logs.
  - services: [postgres]
    example: '2026-10-08 10:58:13.551 UTC [912] FATAL:  sorry, too many clients already'
    level: '\[\d+\] (DEBUG\d?|INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC):'
  # nginx: ingress-nginx controller (klog "E1008 ..." lines + nginx error log) and metadataui nginx.
  - services: [prophecy-nginx-ingress, metadataui]
    example: '2026/10/08 10:58:13 [error] 45#45: *88123 upstream timed out (110: Operation timed out) while reading response header from upstream'
    level: '(?:^\d{4}/\d\d/\d\d \S+ \[|^)(emerg|alert|crit|error|warn|notice|info|debug|[IWEF])(?:\]|\d{4} )'

rules:
  # ---------------------------------------------------------------- generic runtime signals
  - id: jvm-out-of-memory
    title: JVM out of memory
    services: [app, edweb, execution, sparkedge, transpilerweb, metagraph, sandbox, artifactory, neo4j]
    pattern: 'java\.lang\.OutOfMemoryError'
    severity: error
    meaning: The JVM exhausted its heap, metaspace or native threads and the pod will crash or be OOM-killed shortly.
    fix: Raise the container memory limit and -Xmx together for this service, then find the request or job that spikes heap.
    source: ""
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Uncaught error from thread [prophecy-akka.actor.default-dispatcher-12]","logger_name":"akka.actor.ActorSystemImpl","thread_name":"prophecy-akka.actor.default-dispatcher-12","stack_trace":"java.lang.OutOfMemoryError: Java heap space\n\tat java.base/java.util.Arrays.copyOf(Arrays.java:3537)"}'
      - '[ERROR][2026-10-08_10:58:13.551] a.a.ActorSystemImpl - Uncaught error from thread [metagraph-akka.actor.default-dispatcher-7] java.lang.OutOfMemoryError: GC overhead limit exceeded'

  - id: too-many-open-files
    title: Too many open files
    services: []
    pattern: '(?i)too many open files'
    severity: error
    meaning: The process hit its file-descriptor limit, so new sockets and files fail until handles are released.
    fix: Check for connection/file leaks in the pod and raise the container nofile ulimit if the load is legitimate.
    source: ""
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Failed to accept a connection.","logger_name":"io.netty.channel.DefaultChannelPipeline","thread_name":"nioEventLoopGroup-2-1","stack_trace":"java.io.IOException: Too many open files\n\tat java.base/sun.nio.ch.Net.accept(Native Method)"}'
      - "2026-10-08T10:58:13.551Z\terror\tbackup/backup.go:212\tfailed to open dump file: open /tmp/backup/metagraph.sql: too many open files"

  - id: disk-full
    title: No space left on device
    services: []
    pattern: 'No space left on device'
    severity: error
    meaning: A volume or the container filesystem is full, so writes (logs, git repos, dumps, Postgres WAL) are failing.
    fix: Find the full volume with df inside the pod, free space or expand the PVC, then restart the affected service.
    source: ""
    examples:
      - '2026-10-08 10:58:13.551 UTC [87] PANIC:  could not write to file "pg_wal/xlogtemp.87": No space left on device'
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Failed to write repository: java.io.IOException: No space left on device","logger_name":"io.prophecy.metadata.git.JGitClient","thread_name":"pool-3-thread-1"}'

  - id: go-panic
    title: Go panic / fatal error
    services: [athena, cp-operator, go-operator, openidfederator, orchestrator, gitserver, knowledgegraph]
    pattern: '^(panic: |fatal error: )'
    severity: error
    meaning: The Go process crashed with an unrecovered panic or runtime fatal error and the container will restart.
    fix: Read the goroutine trace that follows to find the failing call, and check restart counts with kubectl get pods.
    source: ""
    examples:
      - 'panic: runtime error: invalid memory address or nil pointer dereference'
      - 'fatal error: concurrent map writes'
    not_examples:
      - "2026-10-08T10:58:13.551Z\tinfo\tserver/main.go:40\trecovered from panic: handler returned"

  - id: k8s-observed-panic
    title: Recovered panic in controller
    services: [cp-operator, go-operator, athena]
    pattern: 'Observed a panic'
    severity: error
    meaning: A Kubernetes controller goroutine panicked and was recovered, so the reconcile it was running did not finish.
    fix: Read the stack trace after the line and fix the nil/invalid field in the ProphecyCluster spec or the operator code it points at.
    source: deployment/k8s/controlplane/prophecy-operator/vendor/sigs.k8s.io/controller-runtime/pkg/internal/controller/controller.go:110
    examples:
      - '{"level":"info","ts":1759921093.551,"logger":"controller.prophecycluster-controller","msg":"Observed a panic in reconciler: runtime error: index out of range [0] with length 0","reconciler group":"prophecy.io","reconciler kind":"ProphecyCluster"}'
      - 'E1008 10:58:13.551234       1 runtime.go:79] Observed a panic: "invalid memory address or nil pointer dereference" (runtime error: invalid memory address or nil pointer dereference)'

  - id: dns-resolution-failure
    title: DNS lookup failed
    services: []
    pattern: '(dial tcp: lookup \S+.*no such host|java\.net\.UnknownHostException|Name or service not known|Temporary failure in name resolution)'
    severity: error
    meaning: A hostname (internal service, database, object store or IdP) cannot be resolved from inside the pod.
    fix: Check the hostname in config, that the target Service exists in the namespace, and that CoreDNS/egress DNS is healthy.
    source: ""
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tbackup/s3.go:88\tfailed to upload backup: dial tcp: lookup prophecy-backups.s3.us-west-2.amazonaws.com on 10.96.0.10:53: no such host"
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Request to metagraph failed","logger_name":"io.prophecy.utils.HttpClient","thread_name":"pool-2-thread-5","stack_trace":"java.net.UnknownHostException: metagraph: Name or service not known"}'
      - '2026-10-08 10:58:13,551 - copilot - ERROR - LLM call failed: [Errno -3] Temporary failure in name resolution'

  - id: internal-service-connection-refused
    title: Internal service refused connection
    services: []
    pattern: '(?i)((exec-service|metagraph|sparkedge|edweb|copilot|transpilerweb-service|orchestrator|gitserver|knowledge-graph-service|lineage|neo4j|postgres)[\w.-]*(:\d+)?\S*.{0,120}connection refused|connection refused:? (exec-service|metagraph|sparkedge|edweb|copilot|transpilerweb-service|orchestrator|gitserver|knowledge-graph-service|lineage|neo4j|postgres))'
    severity: error
    meaning: A Prophecy service is calling another in-cluster service that has no listening pod (crashed, restarting or scaled to zero).
    fix: Check the target deployment named in the line with kubectl get pods and its own logs, and confirm its Service has ready endpoints.
    source: ""
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Failed to call metagraph: io.netty.channel.AbstractChannel$AnnotatedConnectException: Connection refused: metagraph/10.4.2.17:9004","logger_name":"io.prophecy.utils.HttpClient","thread_name":"pool-2-thread-5"}'
      - "2026-10-08T10:58:13.551Z\terror\tclient/orchestrator.go:61\tfailed to reach orchestrator: Get \"http://orchestrator:9089/health\": dial tcp 10.4.2.20:9089: connect: connection refused"
    not_examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"INFO","message":"Connected to metagraph at metagraph:9004","logger_name":"io.prophecy.utils.HttpClient","thread_name":"main"}'

  - id: address-already-in-use
    title: Port already in use
    services: []
    pattern: '(?i)address already in use'
    severity: error
    meaning: The server could not bind its listening port because another process in the pod already holds it, so it will not start.
    fix: Check for a duplicate process or sidecar on that port and restart the pod; fix the port config if two components share it.
    source: ""
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Error binding to port 9000","logger_name":"play.core.server.AkkaHttpServer","thread_name":"main","stack_trace":"java.net.BindException: Address already in use"}'
      - "2026-10-08T10:58:13.551Z\tfatal\tcmd/main.go:120\tlisten tcp :8080: bind: address already in use"

  - id: k8s-rbac-forbidden
    title: Kubernetes RBAC forbidden
    services: [athena, cp-operator, go-operator, sandbox, sql]
    pattern: 'is forbidden: User \S+ cannot'
    severity: error
    meaning: The pod's service account lacks a Kubernetes permission it needs, so the create/update/list call was rejected.
    fix: Compare the verb and resource in the line with the Role/ClusterRole bound to that service account and add the missing rule.
    source: ""
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tsnapshot/snapshot_manager.go:790\tfailed to scale deployment: deployments.apps \"cp-prophecy-operator\" is forbidden: User \"system:serviceaccount:prophecy:athena\" cannot patch resource \"deployments/scale\" in API group \"apps\" in the namespace \"prophecy\""

  - id: k8s-field-immutable
    title: Immutable field change rejected
    services: [athena, cp-operator, go-operator]
    pattern: 'field is immutable'
    severity: error
    meaning: An upgrade tried to change an immutable field (for example a Deployment selector or a PVC spec), so the object was not updated.
    fix: Delete the named object so the operator/helm can recreate it (orphan pods for Deployments), then let reconcile continue.
    source: ""
    examples:
      - '{"level":"error","ts":1759921093.551,"logger":"reconciler lib","msg":"Update failed for : app-prophecy Deployment.apps \"app-prophecy\" is invalid: spec.selector: Invalid value: v1.LabelSelector{}: field is immutable","error":"Deployment.apps \"app-prophecy\" is invalid: spec.selector: field is immutable"}'

  # ---------------------------------------------------------------- TLS
  - id: tls-certificate-expired
    title: TLS certificate expired
    services: []
    pattern: '(x509: certificate has expired|CertificateExpiredException|certificate has expired)'
    severity: error
    meaning: A TLS peer (ingress, IdP, git host, object store or internal service) presented an expired certificate and the connection was refused.
    fix: Identify the host from the line, renew its certificate (or the cluster TLS secret) and restart clients that cache it.
    source: ""
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tupgrade/helm.go:144\tfailed to pull chart: Get \"https://charts.example.com/index.yaml\": x509: certificate has expired or is not yet valid: current time 2026-10-08T10:58:13Z is after 2026-10-01T00:00:00Z"
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"SAML metadata fetch failed","logger_name":"io.prophecy.auth.SamlProvider","thread_name":"pool-2-thread-1","stack_trace":"javax.net.ssl.SSLHandshakeException: PKIX path validation failed: java.security.cert.CertificateExpiredException: NotAfter: Wed Oct 01 00:00:00 UTC 2026"}'

  - id: tls-unknown-authority
    title: TLS certificate not trusted
    services: []
    pattern: '(x509: certificate signed by unknown authority|PKIX path building failed|unable to find valid certification path|CERTIFICATE_VERIFY_FAILED)'
    severity: error
    meaning: The pod does not trust the CA that signed a peer's certificate (typically a customer private CA on git, IdP, Databricks or proxy).
    fix: Add the customer CA to the Prophecy truststore/ca-certificates secret used by the pods and restart the affected service.
    source: ""
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Git clone failed","logger_name":"io.prophecy.metadata.git.JGitClient","thread_name":"pool-3-thread-1","stack_trace":"sun.security.validator.ValidatorException: PKIX path building failed: sun.security.provider.certpath.SunCertPathBuilderException: unable to find valid certification path to requested target"}'
      - "2026-10-08T10:58:13.551Z\terror\tpostdeploy/run.go:77\tpost-deploy request failed: Post \"https://prophecy.example.com/api/auth\": x509: certificate signed by unknown authority"
      - '2026-10-08 10:58:13,551 - httpx - ERROR - [SSL: CERTIFICATE_VERIFY_FAILED] certificate verify failed: self-signed certificate in certificate chain'

  # ---------------------------------------------------------------- Postgres (server + clients)
  - id: pg-too-many-clients
    title: Postgres out of connections
    services: []
    pattern: '(sorry, too many clients already|remaining connection slots are reserved)'
    severity: error
    meaning: Postgres has hit max_connections, so new connections from Prophecy services are being rejected.
    fix: Find which service holds the connections (pg_stat_activity), reduce its pool size or raise max_connections on the Postgres server.
    source: ""
    examples:
      - '2026-10-08 10:58:13.551 UTC [912] FATAL:  sorry, too many clients already'
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"HikariPool-1 - Exception during pool initialization.","logger_name":"com.zaxxer.hikari.pool.HikariPool","thread_name":"main","stack_trace":"org.postgresql.util.PSQLException: FATAL: remaining connection slots are reserved for non-replication superuser connections"}'

  - id: pg-password-auth-failed
    title: Postgres password rejected
    services: []
    pattern: 'password authentication failed for user'
    severity: error
    meaning: A service is connecting to Postgres with a wrong or rotated password, so it cannot read or write its metadata.
    fix: Make the DB secret used by the named user match the Postgres password, then restart the services that read it.
    source: ""
    examples:
      - '2026-10-08 10:58:13.551 UTC [77] FATAL:  password authentication failed for user "sdl"'
      - "2026-10-08T10:58:13.551Z\terror\tdao/db.go:41\tfailed to connect to database: failed to connect to `host=postgres user=athena database=athena`: failed SASL auth (FATAL: password authentication failed for user \"athena\" (SQLSTATE 28P01))"

  - id: pg-database-missing
    title: Postgres database does not exist
    services: []
    pattern: 'FATAL:\s+database \S+ does not exist'
    severity: error
    meaning: A service is pointing at a database that was never created (often a failed init/addusers step), so it cannot start.
    fix: Create the missing database and grants (re-run the postgres init/addusers job) and restart the service.
    source: ""
    examples:
      - '2026-10-08 10:58:13.551 UTC [51] FATAL:  database "metadata" does not exist'
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Failed to initialize database","logger_name":"io.prophecy.db.Database","thread_name":"main","stack_trace":"org.postgresql.util.PSQLException: FATAL: database \"metadata\" does not exist"}'

  - id: pg-connection-refused-jdbc
    title: Postgres unreachable (JDBC)
    services: [metagraph]
    pattern: 'Connection to \S+ refused\. Check that the hostname and port are correct'
    severity: error
    meaning: The JVM service cannot open a TCP connection to Postgres; the database pod or managed instance is down or unreachable.
    fix: Check the postgres pod / managed DB status and network path (security groups, private endpoint) from the namespace.
    source: ""
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"HikariPool-1 - Exception during pool initialization.","logger_name":"com.zaxxer.hikari.pool.HikariPool","thread_name":"main","stack_trace":"org.postgresql.util.PSQLException: Connection to postgres:5432 refused. Check that the hostname and port are correct and that the postmaster is accepting TCP/IP connections."}'

  - id: jdbc-pool-timeout
    title: DB connection pool exhausted
    services: [metagraph]
    pattern: 'Connection is not available, request timed out after'
    severity: error
    meaning: Every connection in the HikariCP pool is busy or Postgres is too slow, so requests waited 30s and failed.
    fix: Look for long-running queries or locks in pg_stat_activity, and raise the pool size only if Postgres has headroom.
    source: ""
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Query failed","logger_name":"io.prophecy.metadata.dao.ProjectDao","thread_name":"db-executor-4","stack_trace":"java.sql.SQLTransientConnectionException: db - Connection is not available, request timed out after 30004ms."}'

  - id: pg-server-starting-or-stopping
    title: Postgres not accepting connections
    services: []
    pattern: 'the database system is (starting up|shutting down|in recovery mode|not yet accepting connections)'
    severity: warning
    meaning: Postgres is restarting or recovering, so clients are temporarily refused; persistent repeats mean it is crash-looping.
    fix: If it persists more than a few minutes, read the postgres pod logs for the crash/recovery reason and check its PVC.
    source: ""
    examples:
      - '2026-10-08 10:58:13.551 UTC [33] FATAL:  the database system is starting up'
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"DB check failed","logger_name":"io.prophecy.db.Health","thread_name":"main","stack_trace":"org.postgresql.util.PSQLException: FATAL: the database system is shutting down"}'

  # ---------------------------------------------------------------- nginx (ingress + metadataui)
  - id: nginx-upstream-timeout
    title: Upstream timed out
    services: [prophecy-nginx-ingress, metadataui]
    pattern: 'upstream timed out \(110: (Connection|Operation) timed out\)'
    severity: error
    meaning: A backend Prophecy pod did not answer within the proxy timeout, so the user got a 504.
    fix: Check the upstream pod named in the line for CPU/GC pressure or slow DB calls, and raise proxy-read-timeout only for long-lived endpoints.
    source: ""
    examples:
      - '2026/10/08 10:58:13 [error] 45#45: *88123 upstream timed out (110: Operation timed out) while reading response header from upstream, client: 10.0.0.5, server: prophecy.example.com, request: "GET /api/metadata HTTP/1.1", upstream: "http://10.4.2.17:9000/api/metadata", host: "prophecy.example.com"'

  - id: nginx-no-live-upstreams
    title: No live upstreams
    services: [prophecy-nginx-ingress, metadataui]
    pattern: 'no live upstreams while connecting to upstream'
    severity: error
    meaning: Every backend pod for the route is marked down, so all requests to it return 502/503.
    fix: Check the target Service's endpoints and pod readiness; the backend is crash-looping or failing readiness probes.
    source: ""
    examples:
      - '2026/10/08 10:58:13 [error] 45#45: *88124 no live upstreams while connecting to upstream, client: 10.0.0.5, server: prophecy.example.com, request: "GET / HTTP/1.1", upstream: "http://upstream_balancer/", host: "prophecy.example.com"'

  - id: nginx-upstream-refused
    title: Upstream refused connection
    services: [prophecy-nginx-ingress, metadataui]
    pattern: 'connect\(\) failed \(111: Connection refused\) while connecting to upstream'
    severity: error
    meaning: nginx reached the backend pod IP but nothing was listening, typically a pod that is restarting or still booting.
    fix: Check the upstream pod for restarts and readiness probe timing so traffic is not sent before the app listens.
    source: ""
    examples:
      - '2026/10/08 10:58:13 [error] 45#45: *88125 connect() failed (111: Connection refused) while connecting to upstream, client: 10.0.0.5, server: prophecy.example.com, request: "POST /api/execution HTTP/1.1", upstream: "http://10.4.2.21:9006/api/execution", host: "prophecy.example.com"'

  - id: nginx-upstream-closed-early
    title: Upstream closed connection early
    services: [prophecy-nginx-ingress, metadataui]
    pattern: 'upstream prematurely closed connection while reading'
    severity: warning
    meaning: The backend dropped the connection mid-response, usually because the pod crashed or was OOM-killed during the request.
    fix: Correlate the time with restarts or OOM kills of the upstream pod and look at its logs at that moment.
    source: ""
    examples:
      - '2026/10/08 10:58:13 [error] 45#45: *88126 upstream prematurely closed connection while reading response header from upstream, client: 10.0.0.5, server: prophecy.example.com, request: "GET /api/ws HTTP/1.1", upstream: "http://10.4.2.21:9015/api/ws", host: "prophecy.example.com"'

  - id: ingress-no-active-endpoint
    title: Ingress backend has no endpoints
    services: [prophecy-nginx-ingress]
    pattern: 'Service \S+ does not have any active Endpoint'
    severity: error
    meaning: The ingress controller found no ready pods behind a Prophecy Service, so that route is down.
    fix: Check the deployment behind the named Service for crash loops or failing readiness probes.
    source: ""
    examples:
      - 'W1008 10:58:13.551234       7 controller.go:1214] Service "prophecy/app" does not have any active Endpoint.'

  - id: ingress-ssl-certificate-missing
    title: Ingress TLS secret missing
    services: [prophecy-nginx-ingress]
    pattern: 'Error getting SSL certificate'
    severity: error
    meaning: The TLS secret referenced by a Prophecy ingress is missing or invalid, so nginx serves its fake default certificate.
    fix: Create or fix the TLS secret named in the line (cert and key matching, correct namespace).
    source: ""
    examples:
      - 'W1008 10:58:13.551234       7 backend_ssl.go:47] Error getting SSL certificate "prophecy/prophecy-tls": local SSL certificate prophecy/prophecy-tls was not found. Using default certificate'

  # ---------------------------------------------------------------- operators (cp-operator, go-operator)
  - id: operator-reconciler-error
    title: Operator reconcile failed
    services: [cp-operator, go-operator]
    pattern: '"msg":"Reconciler error"'
    severity: error
    meaning: A ProphecyCluster reconcile returned an error, so one or more Prophecy components were not created or updated and it will retry with backoff.
    fix: Read the error field for the failing resource and fix it (spec value, RBAC, quota or immutable field); repeated errors block upgrades.
    source: deployment/k8s/controlplane/prophecy-operator/vendor/sigs.k8s.io/controller-runtime/pkg/internal/controller/controller.go:324
    examples:
      - '{"level":"error","ts":1759921093.551,"logger":"controller.prophecycluster-controller","msg":"Reconciler error","reconciler group":"prophecy.io","reconciler kind":"ProphecyCluster","name":"prophecy","namespace":"prophecy","error":"configmaps \"app-cm\" not found"}'

  - id: operator-update-failed
    title: Operator failed to update resource
    services: [cp-operator, go-operator]
    pattern: 'Update failed for : '
    severity: error
    meaning: The operator could not update a Kubernetes object for a Prophecy component, so that component keeps its old spec/version.
    fix: Read the API error on the line (immutable field, quota, conflict, webhook) and fix or delete the object so it can be recreated.
    source: deployment/k8s/controlplane/prophecy-operator/pkg/libs/reconciliation/reconcileobject.go:148
    examples:
      - '{"level":"error","ts":1759921093.551,"logger":"reconciler lib","msg":"Update failed for : metagraph-prophecy Operation cannot be fulfilled on deployments.apps \"metagraph-prophecy\": the object has been modified","error":"Operation cannot be fulfilled on deployments.apps \"metagraph-prophecy\": the object has been modified"}'

  - id: operator-create-failed
    title: Operator failed to create resource
    services: [cp-operator, go-operator]
    pattern: 'Creating K8s resource : \S+ failed with error'
    severity: error
    meaning: The operator could not create a Kubernetes object (Deployment, Service, ConfigMap, PVC) for a Prophecy component, so it is missing.
    fix: Fix the cause in the error text (quota exceeded, RBAC, admission webhook, invalid spec) and let the operator retry.
    source: deployment/k8s/controlplane/prophecy-operator/pkg/libs/reconciliation/reconcileobject.go:115
    examples:
      - '{"level":"error","ts":1759921093.551,"logger":"reconciler lib","msg":"Creating K8s resource : copilot-prophecy failed with error: pods \"copilot-prophecy\" is forbidden: exceeded quota: compute-resources","error":"exceeded quota"}'

  # ---------------------------------------------------------------- JVM services (app, edweb, execution, sparkedge)
  - id: app-initial-user-bootstrap-failed
    title: Initial admin user not created
    services: [app]
    pattern: 'Initial (admin|support) user bootstrap gave up for'
    severity: error
    meaning: On first boot app could not create the admin/support user after all retries, so nobody can log in to a fresh install.
    fix: Check that metagraph and openidfederator are healthy (their logs and readiness), then restart app to rerun the bootstrap.
    source: modules/app/app/modules/InitialUserBootstrap.scala:79
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"WARN","message":"Initial admin user bootstrap gave up for admin@example.com: Connection refused: metagraph/10.4.2.17:9004","logger_name":"modules.InitialUserBootstrap","thread_name":"application-akka.actor.default-dispatcher-5"}'

  - id: federator-signing-key-fetch-failed
    title: Cannot fetch signing key from federator
    services: [app, edweb, execution, sparkedge, metagraph]
    pattern: 'Failed to (fetch|refresh) signing key from federator'
    severity: error
    meaning: The service cannot get the JWT signing key from openidfederator, so it fails to start or will reject tokens after the next key rotation.
    fix: Check the openidfederator pod and its Service, and that this pod can reach it; restart the service once federator is healthy.
    source: modules/common/authCom/src/main/scala/auth/silhouette/SigningKeyClient.scala:109
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"WARN","message":"Failed to fetch signing key from federator, retrying in 5 seconds (3 attempts left)","logger_name":"auth.silhouette.SigningKeyClient","thread_name":"main"}'
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"WARN","message":"Failed to refresh signing key from federator; continuing to sign with the previously fetched key (kid=a1b2) until the next attempt in 10 minutes","logger_name":"auth.silhouette.SigningKeyClient","thread_name":"scheduler-1"}'

  - id: oauth-signing-key-not-persisted
    title: OAuth signing key ephemeral
    services: [app, edweb, execution, sparkedge]
    pattern: '(Could not read the persisted OAuth signing key|Generated an OAuth signing key \(kid=\S+\) but could not persist it)'
    severity: error
    meaning: The OAuth signing key could not be read from or saved to metagraph, so tokens issued now (MCP/API clients) will stop verifying after a restart.
    fix: Fix the metagraph connection from this pod and restart it so it loads the persisted key.
    source: modules/common/authCom/src/main/scala/auth/oauth/OAuth2Keys.scala:86
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Could not read the persisted OAuth signing key. Generating an ephemeral pair: tokens issued by this process will not verify after a restart. Fix the metagraph connection.","logger_name":"auth.oauth.OAuth2Keys","thread_name":"main"}'

  - id: oidc-token-exchange-failed
    title: SSO token exchange failed
    services: [app, edweb, execution, sparkedge]
    pattern: 'OpenIDAuth: Error in getting (token from auth code|refresh token)'
    severity: error
    meaning: Exchanging or refreshing an OIDC token with openidfederator/the IdP failed, so SSO logins or session refreshes are failing.
    fix: Check openidfederator logs for the connector error and that the IdP client secret and redirect URL are still valid.
    source: modules/common/authCom/src/main/scala/auth/openid/OpenIDAuthService.scala:494
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"OpenIDAuth: Error in getting token from auth code","logger_name":"auth.openid.OpenIDAuthService","thread_name":"application-akka.actor.default-dispatcher-9","stack_trace":"java.net.ConnectException: Connection refused"}'

  - id: saml-idp-unexpected-response
    title: SAML IdP unexpected response
    services: [app]
    pattern: 'Unexpected response from identity provider'
    severity: error
    meaning: The SAML login round-trip through openidfederator returned something app could not handle, so SAML users get 401.
    fix: Check openidfederator logs and the SAML connector config (IdP metadata, certificate, ACS URL) for the failing connector.
    source: modules/app/app/controllers/Auth2.scala:1674
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Unexpected response from identity provider ","logger_name":"Auth2","thread_name":"application-akka.actor.default-dispatcher-3"}'

  - id: metagraph-graphql-request-failed
    title: Metagraph request failed
    services: [app, edweb, execution, sparkedge]
    pattern: 'Unable to Request from Graphql: '
    severity: error
    meaning: A GraphQL call to metagraph failed, which usually means metagraph or its Postgres is down or overloaded.
    fix: Check the metagraph pod (restarts, logs) and Postgres health; a burst of these points at a metagraph outage.
    source: modules/common/authCom/src/main/scala/services/MetadataService.scala:1623
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Unable to Request from Graphql: Connection refused: metagraph/10.4.2.17:9004","logger_name":"services.MetadataService","thread_name":"pool-2-thread-3"}'

  - id: kg-service-unreachable
    title: Knowledge graph unreachable
    services: [app, edweb]
    pattern: '(Calling the knowledge graph service failed|kg-proxy upstream failure)'
    severity: error
    meaning: app/edweb cannot call the knowledge-graph service, so AI search/context features fail (the proxy returns 502).
    fix: Check the knowledgegraph pod and the knowledge-graph-service endpoints, and its own logs for neo4j/DB errors.
    source: modules/common/core/src/main/scala/io/prophecy/core/knowledgeGraph/client/KnowledgeGraphClient.scala:215
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Calling the knowledge graph service failed","logger_name":"io.prophecy.core.knowledgeGraph.client.KnowledgeGraphClient","thread_name":"pool-5-thread-1"}'
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"kg-proxy upstream failure method=POST path=search target=main","logger_name":"controllers.KnowledgeGraphProxyController","thread_name":"application-akka.actor.default-dispatcher-4"}'

  - id: copilot-service-unreachable
    title: Copilot service call failed
    services: [app, edweb]
    pattern: '(Calling the copilot service failed|Copilot service request failed|Copilot initialization error: )'
    severity: error
    meaning: app/edweb cannot get a response from the copilot pod, so AI features in the editor fail.
    fix: Check the copilot pod logs for LLM provider/auth errors and that the copilot Service has ready endpoints.
    source: modules/common/core/src/main/scala/io/prophecy/core/copilot/client/CopilotClient.scala:554
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Calling the copilot service failed","logger_name":"io.prophecy.core.copilot.client.CopilotClient","thread_name":"pool-5-thread-2"}'
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Copilot initialization error: Connection refused","logger_name":"actors.sql.InitializationUtils","thread_name":"pool-5-thread-2"}'

  - id: edweb-master-sql-actor-dead
    title: Editor SQL actor tree shut down
    services: [edweb]
    pattern: '\[Panic state\] Master sql actor failed to initialize after restart'
    severity: error
    meaning: edweb's master SQL actor could not restart, so every SQL editor session on this pod is being killed.
    fix: Read the preceding errors (usually metagraph/DB init failures) and restart the edweb pod once the dependency is healthy.
    source: modules/editor/eweb/app/actors/sql/SqlSessionManager.scala:714
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"[Panic state] Master sql actor failed to initialize after restart. Shutting actors down!","logger_name":"actors.sql.SqlSessionManager","thread_name":"application-akka.actor.default-dispatcher-2"}'

  - id: agent-sandbox-websocket-down
    title: Agent sandbox websocket down
    services: [app, edweb]
    pattern: '(Failed to connect WebSocket: |Failed to reconnect after \d+ attempts, giving up automatic reconnection)'
    severity: error
    meaning: The connection to the AI agent sandbox is down and automatic reconnection gave up, so agent conversations fail.
    fix: Check the sandbox pods (athena sandbox pool) are running and reachable from app/edweb.
    source: modules/common/core/src/main/scala/io/prophecy/core/sql/sandbox/AgentWebSocketClient.scala:1755
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"WARN","message":"Failed to reconnect after 5 attempts, giving up automatic reconnection","logger_name":"io.prophecy.core.sql.sandbox.AgentWebSocketClient","thread_name":"pool-7-thread-1"}'

  - id: orchestrator-rdc-websocket-down
    title: Orchestrator RDC websocket down
    services: [app, edweb, sparkedge]
    pattern: '(Failed to connect RDC WebSocket: |Failed to reconnect RDC WebSocket after \d+ attempts, giving up)'
    severity: error
    meaning: The control plane lost its websocket to the execution-plane orchestrator, so remote runs and status updates stop flowing.
    fix: Check the orchestrator pod and the ingress/network path between control plane and execution plane.
    source: modules/common/core/src/main/scala/io/prophecy/core/orchestration/client/OrchestratorRdcWebSocketClient.scala:257
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"WARN","message":"Failed to reconnect RDC WebSocket after 10 attempts, giving up","logger_name":"io.prophecy.core.orchestration.client.OrchestratorRdcWebSocketClient","thread_name":"pool-7-thread-2"}'

  - id: databricks-cluster-start-failed
    title: Databricks cluster start failed
    services: [execution]
    pattern: '"message":"Cluster startup failed"'
    severity: error
    meaning: Creating/starting a Databricks cluster for an interactive session failed, so the user cannot attach to that fabric.
    fix: Read the stack trace for the Databricks API error (token, permissions, quota, instance pool) and fix it on the fabric.
    source: modules/execution/app/execution/databricks/DatabricksWorkspaceActor.scala:1026
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Cluster startup failed","logger_name":"execution.databricks.DatabricksWorkspaceActor","thread_name":"prophecy-akka.actor.default-dispatcher-11","stack_trace":"io.prophecy.execution.DatabricksException: 403 Invalid access token"}'

  - id: sparkedge-orchestrator-connect-failed
    title: Deployment cannot reach orchestrator
    services: [sparkedge]
    pattern: 'connecting_to_orchestrator step failed for deploymentID'
    severity: error
    meaning: A job/pipeline deployment from sparkedge could not connect to the execution-plane orchestrator and was aborted.
    fix: Check the orchestrator pod and the URL/credentials sparkedge uses for it, plus network path to the execution plane.
    source: modules/sparkedge/service/app/orchestrator/Orchestrator.scala:660
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"connecting_to_orchestrator step failed for deploymentID = 8812","logger_name":"Orchestrator","thread_name":"prophecy-akka.actor.default-dispatcher-3"}'

  # ---------------------------------------------------------------- metagraph (text logback)
  - id: metagraph-db-health-failed
    title: Metagraph DB health check failed
    services: [metagraph]
    pattern: 'DB connection health check failed'
    severity: error
    meaning: metagraph's SELECT 1 against Postgres failed or timed out, so all metadata reads/writes across Prophecy are failing.
    fix: Check the Postgres pod/managed DB, its connection count and network path from metagraph.
    source: modules/metadataV2/mweb/src/main/scala/io/prophecy/metadata/db/DatabaseConnection.scala:285
    examples:
      - '[ERROR][2026-10-08_10:58:13.551] P.DatabaseConnection - DB connection health check failed: Connection is not available, request timed out after 5000ms.'

  - id: metagraph-db-config-from-athena-failed
    title: Metagraph cannot get DB config
    services: [metagraph]
    pattern: 'failed to get db config from athena'
    severity: error
    meaning: metagraph could not obtain its database credentials from athena at startup, so it cannot connect to Postgres.
    fix: Check the athena pod is up and its secret API answers, then restart metagraph.
    source: modules/metadataV2/mweb/src/main/scala/io/prophecy/metadata/db/DatabaseConnection.scala:88
    examples:
      - '[ERROR][2026-10-08_10:58:13.551] P.DatabaseConnection - failed to get db config from athena DecodingFailure(Attempt to decode value on failed cursor)'

  - id: metagraph-missing-evolutions
    title: Metagraph schema re-initialising
    services: [metagraph]
    pattern: 'Database \S+ is missing evolutions! Initializing'
    severity: warning
    meaning: metagraph found no schema history in its database and is initialising it; on an existing install this means it is pointed at the wrong or an emptied database.
    fix: On an existing install, stop and confirm the DB host/name in the metagraph config before it writes a fresh schema; ignore on first install.
    source: modules/metadataV2/mweb/src/main/scala/io/prophecy/metadata/db/Evolutions.scala:91
    examples:
      - '[WARN][2026-10-08_10:58:13.551] P.Evolutions - Database metadata is missing evolutions! Initializing'

  - id: metagraph-master-key-mismatch
    title: Encryption master key mismatch
    services: [metagraph]
    pattern: 'master key doesnt match existing master key need to exit'
    severity: error
    meaning: The PII encryption master key given to metagraph does not match the one the database was encrypted with, so metagraph exits and crash-loops (logged at INFO).
    fix: Restore the original master key secret for this database (never generate a new one against existing data).
    source: modules/metadataV2/mweb/src/main/scala/io/prophecy/metadata/models/ValueEncryptionDAO.scala:88
    examples:
      - '[INFO][2026-10-08_10:58:13.551] P.ValueEncryptionDAO - master key doesnt match existing master key need to exit'

  - id: metagraph-pii-migration-failed
    title: Encryption migration failed
    services: [metagraph]
    pattern: '(PII migration failed|PII migration did not finish within|\[PII migration v\d+\] Failed to write)'
    severity: error
    meaning: metagraph's startup encryption migration failed or stalled, so some secrets/connector values may be unreadable.
    fix: Check the exception for DB or key errors, fix them and restart metagraph so the migration re-runs.
    source: modules/metadataV2/mweb/src/main/scala/io/prophecy/metadata/SystemContext.scala:250
    examples:
      - '[ERROR][2026-10-08_10:58:13.551] P.SystemContext - PII migration failed'

  - id: metagraph-decrypt-failed
    title: Connector secret decrypt failed
    services: [metagraph]
    pattern: 'Failed to decrypt connector param, returning it unchanged'
    severity: error
    meaning: metagraph cannot decrypt stored connector secrets, usually because the encryption key was rotated or replaced, so fabrics/connections using them fail.
    fix: Restore the encryption key that matches the stored data; re-enter the affected connector secrets if the key is lost.
    source: modules/metadataV2/mweb/src/main/scala/io/prophecy/metadata/models/entities/connector.scala:219
    examples:
      - '[ERROR][2026-10-08_10:58:13.551] P.connector - Failed to decrypt connector param, returning it unchanged. Tag mismatch!'

  - id: metagraph-gitserver-down
    title: Metagraph cannot reach gitserver
    services: [metagraph]
    pattern: '(Gitea is not coming up\.|Gitea health check failed: )'
    severity: error
    meaning: metagraph cannot reach the gitserver (Gitea) API, so project storage, commits and clones are failing.
    fix: Check the gitserver pod (it needs Postgres and athena to start) and the Gitea admin credentials.
    source: modules/metadataV2/mgitea/src/main/scala/io/prophecy/metadata/gitea_client/GiteaClient.scala:106
    examples:
      - '[ERROR][2026-10-08_10:58:13.551] P.GiteClient - Gitea is not coming up.'
      - '[ERROR][2026-10-08_10:58:13.551] P.GiteClient - Gitea health check failed: Connection refused: gitserver/10.4.2.30:3000'

  - id: metagraph-dependency-not-coming-up
    title: Metagraph dependency down
    services: [metagraph]
    pattern: '(Artifactory|SparkEdge) is not coming up\.'
    severity: error
    meaning: metagraph gave up waiting for artifactory or sparkedge at startup, so package publishing or job deployment features are broken.
    fix: Check the named pod (artifactory or sparkedge) for crash loops and its Service endpoints.
    source: modules/metadataV2/mweb/src/main/scala/io/prophecy/metadata/utils/ArtifactoryClient.scala:61
    examples:
      - '[ERROR][2026-10-08_10:58:13.551] P.ArtifactoryClient - Artifactory is not coming up.'

  # ---------------------------------------------------------------- transpilerweb
  - id: transpiler-athena-unreachable
    title: Transpiler cannot reach athena
    services: [transpilerweb]
    pattern: '(Error fetching Prophecy version from athena|Failed to fetch Athena metering for team \S+ .*failing closed)'
    severity: error
    meaning: transpilerweb cannot call athena; metering checks fail closed, so transpile/import jobs are blocked.
    fix: Check the athena pod and its Service from the transpilerweb pod.
    source: modules/transpiler/tweb/app/workers/TranspilerSessionActor.scala:2899
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"Failed to fetch Athena metering for team 42 — failing closed","logger_name":"workers.TranspilerSessionActor","thread_name":"transpiler-akka.actor.default-dispatcher-5"}'

  # ---------------------------------------------------------------- gitserver (Gitea 1.12 fork)
  - id: gitserver-waiting-for-postgres
    title: Gitserver waiting for Postgres
    services: [gitserver]
    pattern: 'Postgres is unavailable - sleeping'
    severity: warning
    meaning: gitserver's startup script cannot reach its Postgres database and Gitea will not start until it can.
    fix: Check Postgres health and the gitserver DB credentials served by athena; persistent repeats mean the DB is down.
    source: containers/sdl-git/run_git_server.sh:29
    examples:
      - 'Postgres is unavailable - sleeping'

  - id: gitserver-orm-init-failed
    title: Gitea database init failed
    services: [gitserver]
    pattern: 'ORM engine initialization (failed|attempt #\d+/\d+ failed)'
    severity: error
    meaning: Gitea cannot connect to or initialise its database, so all git operations through gitserver fail.
    fix: Check Postgres reachability and the gitea DB/user/grants (PG15+ needs explicit public schema grants).
    source: ""
    examples:
      - '2026/10/08 10:58:13 routers/init.go:117:GlobalInit() [F] ORM engine initialization failed: dial tcp 10.4.2.9:5432: connect: connection refused'

  # ---------------------------------------------------------------- artifactory (Sonatype Nexus 3)
  - id: artifactory-not-ready
    title: Artifactory did not become ready
    services: [artifactory]
    pattern: 'Artifactory did not become ready within \d+s'
    severity: error
    meaning: Nexus did not pass its status check within the postStart timeout, so the hook failed and the pod is being killed.
    fix: Read the nexus.log lines printed after this message (disk, DB/H2, memory) and check the nexus-data PVC.
    source: baseimage/platformbaseimages/artifactory/post_start.sh:102
    examples:
      - '[artifactory-post-start] Artifactory did not become ready within 300s; last nexus.log lines:'

  # ---------------------------------------------------------------- sandbox (Scala / Python sandbox pods)
  - id: sandbox-scala-interpreter-failed
    title: Scala sandbox interpreter failed
    services: [sandbox]
    pattern: 'exception occurred while (creating new scala interpreter|downloading dependencies for new scala interpreter)'
    severity: error
    meaning: The Scala sandbox could not create an interpreter session (often dependency download from artifactory/Maven failed), so gem/schema analysis fails.
    fix: Check artifactory/Maven reachability from sandbox pods and pod memory.
    source: modules/scalaSandbox/schemaAnalysisServer/app/interpreter/InterpreterManager.scala:91
    examples:
      - '{"timestamp":"2026-10-08T10:58:13.551Z","level":"ERROR","message":"exception occurred while creating new scala interpreter","logger_name":"interpreter.InterpreterManager","thread_name":"pool-2-thread-1"}'

  # ---------------------------------------------------------------- athena (Go, zap console)
  - id: athena-db-connect-failed
    title: Athena cannot reach its database
    services: [athena]
    pattern: '(Couldn''t connect to athena DB: |Failed connecting to (athena|gitserver) DB: )'
    severity: error
    meaning: Athena cannot open its own (or the gitserver) Postgres database, so it crash-loops and no install, upgrade, backup or status reporting works.
    fix: Check the Postgres pod/managed DB, the athena DB credentials secret, and that the athena database and user exist.
    source: deployment/k8s/athena/data/psql/connection.go:147
    examples:
      - "2026-10-08T10:58:13.551Z\tfatal\tcmd/athena.go:106\tCouldn't connect to athena DB: failed to connect to `host=postgres user=athena database=athena`: dial error (dial tcp 10.4.2.9:5432: connect: connection refused)"
      - "2026-10-08T10:58:13.551Z\terror\tpsql/connection.go:147\tFailed connecting to athena DB: dial tcp 10.4.2.9:5432: i/o timeout"

  - id: athena-install-failed
    title: Initial installation failed
    services: [athena]
    pattern: '\binstallation failed: '
    severity: error
    meaning: The initial helm install of the Prophecy control plane failed and athena exits.
    fix: Read the helm error on the line (chart pull, values, quota, existing release) and fix it before athena restarts and retries.
    source: deployment/k8s/athena/cmd/athena.go:236
    examples:
      - "2026-10-08T10:58:13.551Z\tfatal\tcmd/athena.go:236\tinstallation failed: rendered manifests contain a resource that already exists"

  - id: athena-verticals-config-missing
    title: Athena refuses to start (verticals config)
    services: [athena]
    pattern: 'Verticals config failed to load from DB at boot, but vertical apps are enabled'
    severity: error
    meaning: Vertical apps are enabled but their config could not be read from the athena DB, so athena deliberately refuses to start.
    fix: Restore the verticals config row in the athena DB (or fix DB connectivity), or disable ENABLE_VERTICAL_APPS until it is fixed.
    source: deployment/k8s/athena/pkg/config/verticals_config.go:139
    examples:
      - "2026-10-08T10:58:13.551Z\tfatal\tconfig/verticals_config.go:139\tVerticals config failed to load from DB at boot, but vertical apps are enabled (ENABLE_VERTICAL_APPS=true, PROPHECY_PROFESSIONAL_EDITION_ENABLED=false). Refusing to start to prevent metering operations against a stale or missing config."

  - id: athena-pg-dump-failed
    title: Database backup (pg_dump) failed
    services: [athena]
    pattern: '(error occurred while backup: |error occurred while backing up postgres configs table: )'
    severity: error
    meaning: The scheduled/manual database backup failed while dumping a Postgres database, so this backup is incomplete.
    fix: Check pg_dump error text (auth, disk space in the athena pod, DB version mismatch) and trigger a new backup once fixed.
    source: deployment/k8s/athena/pkg/backup/backup.go:157
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tbackup/backup.go:157\terror occurred while backup: exit status 1: pg_dump: error: server version: 16.9; pg_dump version: 15.4"

  - id: athena-rds-snapshot-failed
    title: RDS snapshot failed
    services: [athena]
    pattern: '(Error triggering RDS snapshot: |Failed waiting for DB snapshot to be available: |Failed to copy snapshot to other region: )'
    severity: error
    meaning: Backing up the managed AWS RDS database (or copying it to the DR region) failed, so there is no fresh DB backup.
    fix: Check the IAM permissions for rds:CreateDBSnapshot/CopyDBSnapshot and the RDS snapshot quota in that account.
    source: deployment/k8s/athena/pkg/backup/backup.go:220
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tbackup/backup.go:220\tError triggering RDS snapshot: AccessDenied: User is not authorized to perform: rds:CreateDBSnapshot"

  - id: athena-restore-failed
    title: Restore failed
    services: [athena]
    pattern: '(Error restoring postgres for database \S+ with error: |Pre restore all pods up check failed|Restoration validation failed: )'
    severity: error
    meaning: A restore did not run or did not complete (unhealthy cluster before restore, or a database failed to load), so data may be partially restored.
    fix: Fix the unhealthy pods or the failing database error, then re-run the restore from the same backup.
    source: deployment/k8s/athena/pkg/backup/restore.go:582
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tbackup/restore.go:582\tError restoring postgres for database metadata with error: exit status 3"
      - "2026-10-08T10:58:13.551Z\terror\tbackup/restore.go:219\tPre restore all pods up check failed - metagraph-prophecy not ready"

  - id: athena-object-store-failed
    title: Backup object storage failed
    services: [athena]
    pattern: '(Unable to (download object|upload) \S+ (from bucket: |to )\S+.*Error: |Uploading events to object store failed with error: |\[wal\] upload \S+ failed)'
    severity: error
    meaning: Athena cannot read or write the backup/audit bucket, so backups, restores or audit uploads are failing.
    fix: Check the bucket name, the pod's cloud credentials/IAM role (or workload identity) and network egress to the object store.
    source: deployment/k8s/athena/pkg/provider/aws.go:174
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tprovider/aws.go:174\tUnable to upload backups/2026-10-08/metadata.sql to prophecy-backups, Error: AccessDenied: Access Denied"
      - "2026-10-08T10:58:13.551Z\terror\twal/upload.go:277\t[wal] upload /data/wal/000123.log failed (kept for retry): context deadline exceeded"

  - id: athena-snapshot-backup-failed
    title: Snapshot backup failed
    services: [athena]
    pattern: '(Failed to create snapshot based backup for timestamp |Failed initializing snapshotManager: |Failed to create snapshot with name |Failed to mark backup \S+ FAILED in DB)'
    severity: error
    meaning: The volume-snapshot based backup failed (snapshot manager could not start or a PVC snapshot failed), so there is no new restore point.
    fix: Check the cloud credentials/permissions for disk snapshots and the VolumeSnapshotClass, then re-trigger the backup.
    source: deployment/k8s/athena/pkg/cronjob/cronjob.go:115
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tcronjob/cronjob.go:115\tFailed to create snapshot based backup for timestamp 2026-10-08T10-00-00: snapshot gitserver-pvc failed"
      - "2026-10-08T10:58:13.551Z\twarn\tsnapshot/snapshot_manager.go:306\tFailed to create snapshot with name cp-metagraph-20261008: googleapi: Error 403: Required 'compute.snapshots.create' permission"

  - id: athena-upgrade-failed
    title: Upgrade failed
    services: [athena]
    pattern: '(Upgrade to version \S+ failed with error: |Controlplane upgrade failed: |Failed to update helm repo: )'
    severity: error
    meaning: A Prophecy version upgrade failed in helm, so the cluster is on the old version (or partially upgraded) and athena will try to roll back.
    fix: Read the helm error, fix it (chart repo reachability, immutable fields, quota) and re-run the upgrade; check the rollback line that follows.
    source: deployment/k8s/athena/pkg/upgrade/update.go:91
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tupgrade/update.go:91\tUpgrade to version 4.2.11.0 failed with error: UPGRADE FAILED: timed out waiting for the condition"

  - id: athena-rollback-failed
    title: Upgrade rollback failed
    services: [athena]
    pattern: 'Rollback to version \S+ failed with error: '
    severity: error
    meaning: An upgrade failed and the automatic rollback also failed, leaving the release in a broken/partial state.
    fix: Inspect helm history for the release, roll back manually to the last deployed revision, and fix the original upgrade error.
    source: deployment/k8s/athena/pkg/upgrade/update.go:95
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tupgrade/update.go:95\tRollback to version 4.2.10.3 failed with error: another operation (install/upgrade/rollback) is in progress"

  - id: athena-scale-up-failed
    title: Deployment left scaled down
    services: [athena]
    pattern: '(Scaling up DP operator failed: |Failed to scale up deployment \S+ after all retries)'
    severity: error
    meaning: After an upgrade/snapshot athena could not scale an operator or service back up, so it stays at 0 replicas.
    fix: Scale the named deployment back up with kubectl and check why the scale call failed (RBAC, conflict, API errors).
    source: deployment/k8s/athena/pkg/installation/update_cluster_services.go:355
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tinstallation/update_cluster_services.go:355\tFailed to scale up deployment cp-prophecy-operator after all retries: Timeout: request did not complete within requested timeout"

  - id: athena-selfsigned-cert-failed
    title: Self-signed cert setup failed
    services: [athena]
    pattern: 'Failed to set up the self signed certs : '
    severity: error
    meaning: Athena could not generate or store the self-signed CA/truststore, so internal TLS and pods that mount the truststore will fail.
    fix: Check the keytool/openssl error lines above and that athena can create secrets in the namespace.
    source: deployment/k8s/athena/cmd/athena.go:411
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tcmd/athena.go:411\tFailed to set up the self signed certs : Failed to create secret : secrets \"prophecy-ca\" already exists"

  - id: athena-sandbox-pod-create-failed
    title: Sandbox pool pod creation failed
    services: [athena]
    pattern: '(Failed to create sandbox pod named \S+: .* in pool|Failed to initialize sandbox config from DB, hence sandbox pool won''t be created)'
    severity: error
    meaning: Athena cannot create pods for the SQL/Python sandbox pool, so users waiting for a sandbox (agent, SQL, gem builder) will time out.
    fix: Check namespace quota, node capacity, image pull access and the sandbox config in the athena DB.
    source: deployment/k8s/athena/pkg/sandbox-pools/pod_pools.go:773
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tsandbox-pools/pod_pools.go:773\tFailed to create sandbox pod named sql-sandbox-7f2k: pods \"sql-sandbox-7f2k\" is forbidden: exceeded quota: compute-resources in pool"

  - id: orchestrator-sandbox-unschedulable
    title: Run failed because its go-sandbox could not be scheduled
    services: [orchestrator]
    pattern: 'Pod go-operator-sandbox-\S+ failed to start: Unschedulable'
    severity: error
    meaning: >-
      A pipeline run needed a new go-sandbox and no node had room, so the orchestrator failed the run (and every parent
      Pipeline gem) about 200 ms after creating the pod instead of waiting for the autoscaler to add a node. Since
      orchestrator 4.2.12.1 this happens even on autoscaling clusters (GKE Autopilot, Karpenter); on 4.2.11.x runs waited.
      The pod usually starts later anyway and is left orphaned, holding CPU and memory.
    fix: >-
      Check the orchestrator version (4.2.12.1 regression) and node headroom in prophecy-execution. Delete orphaned
      go-operator-sandbox pods that no run uses (see the readiness check "Orphaned go-sandboxes") to free capacity, and
      rerun the pipeline. If nodes are genuinely full (taints, disk pressure, quota), fix capacity first.
    source: prophecy-orchestrate/pkg/rm/k8s/resource_manager.go:812
    examples:
      - '{"service":"orchestrator","level":"error","caller":"/appsrc/pkg/rm/k8s/resource_manager.go:812","time":"2026-10-19T02:37:39.569753083Z","message":"Pod go-operator-sandbox-tdeemg failed to start: Unschedulable: 0/3 nodes are available: 1 node(s) had untolerated taint {node.kubernetes.io/disk-pressure: }, 2 Insufficient cpu. preemption: 0/3 nodes are available: 1 Preemption is not helpful for scheduling, 2 No preemption victims found for incoming pod."}'
      - '{"service":"orchestrator","error":"Pod go-operator-sandbox-thuyqr failed to start: Unschedulable: 0/10 nodes are available: 10 Insufficient memory, 3 Insufficient cpu. no new claims to deallocate, preemption: 0/10 nodes are available: 10 No preemption victims found for incoming pod.","level":"error","caller":"/appsrc/pkg/rm/k8s/resource_manager.go:812"}'
    not_examples:
      - '{"service":"orchestrator","level":"info","caller":"/appsrc/pkg/rm/k8s/resource_manager.go:1324","message":"created go-operator-sandbox-icmncx"}'

  - id: athena-postdeploy-transient-retry
    title: Post-deploy step retrying
    services: [athena]
    pattern: 'Transient error \(attempt \d+/\d+\), retrying in '
    severity: warning
    meaning: A post-deploy step (metagraph/app/orchestrator call) failed transiently and is retrying; final failures are recorded only in the post-deploy job status, not logged.
    fix: If retries keep appearing, check the target service named in the error and query the post-deploy job status endpoint for the final result.
    source: deployment/k8s/athena/pkg/postdeploy/runner.go:93
    examples:
      - "2026-10-08T10:58:13.551Z\twarn\tpostdeploy/runner.go:93\tTransient error (attempt 2/5), retrying in 4s: Post \"http://app:9000/api/teams\": dial tcp 10.4.2.3:9000: connect: connection refused"

  - id: athena-controlhub-sync-failed
    title: Metering sync to Control Hub failed
    services: [athena]
    pattern: '(Failed to make request to Control Hub: |Control Hub API returned status: |CONTROLHUB_URL is not set|INFRASTRUCTURE_ID is not set)'
    severity: warning
    meaning: Athena cannot report metering/usage to Control Hub (unreachable, rejected, or not configured), so billing/usage data for this cluster is stale.
    fix: Check CONTROLHUB_URL/INFRASTRUCTURE_ID in athena env and egress to Control Hub; a 401/403 status means the cluster token is wrong.
    source: deployment/k8s/athena/pkg/metering/controlhub_sync.go:149
    examples:
      - "2026-10-08T10:58:13.551Z\terror\tmetering/controlhub_sync.go:149\tFailed to make request to Control Hub: Post \"https://controlhub.example.com/api/metering\": context deadline exceeded"

  # ---------------------------------------------------------------- openidfederator (dex fork, logrus text)
  - id: federator-storage-init-failed
    title: Federator storage init failed
    services: [openidfederator]
    pattern: '(failed to initialize storage: |failed to perform migrations: |failed to initialize db encryption: )'
    severity: error
    meaning: openidfederator cannot open or migrate its Postgres storage and exits, so nobody can log in.
    fix: Check the federator DB credentials/host and Postgres health; for migration errors check for a half-applied migration or lock.
    source: deployment/k8s/platform/auth/openidfederator/cmd/openidfederator/authserver.go:227
    examples:
      - 'failed to initialize storage: failed to perform migrations: pq: permission denied for schema public'

  - id: federator-key-rotation-failed
    title: Federator signing key rotation failed
    services: [openidfederator]
    pattern: '(failed to rotate keys: |failed to get keys: |No signing key found\.)'
    severity: error
    meaning: openidfederator cannot rotate or read its token signing keys, so token issuance and JWKS fetches by app/edweb fail.
    fix: Check the federator storage (Postgres) health and the keys table; restart federator once storage is healthy.
    source: deployment/k8s/platform/auth/openidfederator/server/rotation.go:79
    examples:
      - 'time="2026-10-08T10:58:13Z" level=error msg="failed to rotate keys: pq: could not serialize access due to concurrent update"'

  - id: federator-upstream-auth-failed
    title: SSO upstream authentication failed
    services: [openidfederator]
    pattern: 'msg="Failed to authenticate: .*(failed to connect|failed to bind|saml|oidc|x509|timeout|refused)'
    severity: error
    meaning: The upstream IdP (LDAP/SAML/OIDC) could not be reached or rejected federator's service credentials, so SSO logins fail.
    fix: Check IdP reachability and the connector's bind DN/client secret/certificate; ignore single invalid-password failures.
    source: deployment/k8s/platform/auth/openidfederator/server/handlers.go:1363
    examples:
      - 'time="2026-10-08T10:58:13Z" level=error msg="Failed to authenticate: ldap: failed to connect: LDAP Result Code 200 \"Network Error\": dial tcp 10.10.0.5:636: i/o timeout"'
      - 'time="2026-10-08T10:58:13Z" level=error msg="Failed to authenticate: ldap: failed to bind as dn \"cn=svc-prophecy,dc=corp\": LDAP Result Code 49 \"Invalid Credentials\""'
    not_examples:
      - 'time="2026-10-08T10:58:13Z" level=error msg="Failed to authenticate: ldap: invalid password for user \"jdoe\""'

  # ---------------------------------------------------------------- orchestrator (prophecy-orchestrate, zerolog JSON)
  - id: orchestrator-db-failed
    title: Orchestrator database failed
    services: [orchestrator]
    pattern: '(Failed to open Postgres database: |Failed to automigrate model \S+ in orchestratorDB|Failed to initialize ConfigDB)'
    severity: error
    meaning: The execution-plane orchestrator cannot open or migrate its Postgres database, so scheduling and remote runs are down.
    fix: Check the execution-plane postgres pod/credentials and, for migration errors, the schema state of the orchestrator DB.
    source: prophecy-orchestrate/pkg/db/db.go:77
    examples:
      - '{"level":"error","service":"orchestrator","time":"2026-10-08T10:58:13.551234Z","caller":"/app/pkg/db/db.go:77","message":"Failed to open Postgres database: dial tcp 10.4.3.2:5432: connect: connection refused"}'

  - id: orchestrator-server-failed
    title: Orchestrator server failed to start
    services: [orchestrator]
    pattern: '(Error occurred Running Servers|Failed to start (Orchestrator|TaskCoordinator) GRPC server|(Orchestrator|TaskCoordinator) GRPC server failed to run)'
    severity: error
    meaning: One of the orchestrator's servers failed to start or crashed and the process is exiting.
    fix: Read the error field (port in use, TLS/config error) and check the pod's restart reason.
    source: prophecy-orchestrate/pkg/service/app.go:375
    examples:
      - '{"level":"fatal","service":"orchestrator","port":9090,"time":"2026-10-08T10:58:13.551234Z","caller":"/app/pkg/service/app.go:375","message":"Error occurred Running Servers - listen tcp :9090: bind: address already in use"}'

  # ---------------------------------------------------------------- copilot (Python, structlog)
  - id: copilot-llm-not-configured
    title: Copilot has no usable LLM
    services: [copilot]
    pattern: '(AI model cloud provider details are not configured\.|No Available AI Models set\.|No models are present in the config\.|Model/deployment details are not configured properly)'
    severity: error
    meaning: Copilot started without any usable LLM provider/model configuration, so every AI feature fails.
    fix: Set AI_MODEL_PROVIDERS_CREDS and AVAILABLE_AI_MODELS (or the LLM settings in Prophecy admin) to a model with valid provider credentials.
    source: copilot/app/app_config.py:563
    examples:
      - '2026-10-08T10:58:13.551442Z [error    ] No models are present in the config. filename=app_config.py func_name=<module> lineno=563 module=app_config'

  - id: copilot-startup-config-exit
    title: Copilot exits on bad config
    services: [copilot]
    pattern: '(Redis|Postgres) not configured properly\. Error: '
    severity: error
    meaning: Copilot found invalid Redis or Postgres settings at startup and exited, so the pod crash-loops.
    fix: Fix the REDIS_* / Postgres env variables in the copilot config and restart.
    source: copilot/app/app_config.py:609
    examples:
      - "2026-10-08T10:58:13.551442Z [error    ] Redis not configured properly. Error: invalid literal for int() with base 10: 'abc' filename=app_config.py lineno=609"

  - id: copilot-model-creds-malformed
    title: Copilot model credentials malformed
    services: [copilot]
    pattern: 'ast\.literal_eval\(ai_model_provider_creds_str\)'
    severity: error
    meaning: AI_MODEL_PROVIDERS_CREDS is not a valid Python literal, so copilot's config import raises at startup and every worker fails to boot.
    fix: Fix the AI_MODEL_PROVIDERS_CREDS value in the copilot deployment (a dict literal; check quoting and stray characters) and restart copilot.
    source: copilot/app/app_config.py:444
    examples:
      - '    ast.literal_eval(ai_model_provider_creds_str)'
    not_examples:
      - 'ai_model_provider_creds_str = os.getenv("AI_MODEL_PROVIDERS_CREDS")'

  - id: gunicorn-worker-boot-failed
    title: Gunicorn workers failed to boot
    services: [copilot]
    pattern: 'Reason: Worker failed to boot\.'
    severity: error
    meaning: Every gunicorn worker crashed while importing the app, so the master exited and the pod crash-loops; the traceback just above names the cause.
    fix: Open the previous container's logs and read the traceback before this line; it is usually a config or dependency error at import time.
    source: ""
    examples:
      - '[2026-10-08 19:10:39 +0000] [1] [ERROR] Reason: Worker failed to boot.'

  - id: copilot-llm-auth-failed
    title: LLM provider rejected API key
    services: [copilot]
    pattern: 'LLM provider rejected the API key'
    severity: error
    meaning: The configured LLM provider returned 401 for copilot's key (revoked, expired or wrong), so AI requests fail.
    fix: Rotate/replace the provider API key in the copilot LLM settings and verify it against the provider directly.
    source: copilot/app/clients/aimodel.py:887
    examples:
      - '2026-10-08T10:58:13.551442Z [error    ] LLM provider rejected the API key filename=aimodel.py func_name=get_openai_response lineno=887'

  - id: copilot-llm-call-failed
    title: LLM call failed or timed out
    services: [copilot]
    pattern: '(Error while getting OpenAI response|Timeout occurred while fetching OpenAI response\.)'
    severity: warning
    meaning: Calls to the LLM provider are failing or timing out (rate limits, provider outage, network egress); a burst means AI is down for users.
    fix: Check the exception for 429/5xx, the provider status page and egress/proxy from the copilot pod.
    source: copilot/app/clients/aimodel.py:919
    examples:
      - '2026-10-08T10:58:13.551442Z [error    ] Error while getting OpenAI response filename=aimodel.py func_name=get_openai_response lineno=919'
      - '2026-10-08T10:58:13.551442Z [error    ] Timeout occurred while fetching OpenAI response. filename=aimodel.py lineno=923'

  - id: copilot-kg-unreachable
    title: Copilot cannot reach knowledge graph
    services: [copilot]
    pattern: '(Knowledge graph client error occurred: |Knowledge graph server error occurred: )'
    severity: error
    meaning: Copilot cannot call the knowledge-graph service (connection error or 5xx), so context-aware AI answers degrade.
    fix: Check the knowledgegraph pod and its neo4j dependency.
    source: copilot/app/clients/knowledge_graph.py:161
    examples:
      - '2026-10-08T10:58:13.551442Z [error    ] Knowledge graph client error occurred: Cannot connect to host knowledge-graph-service:50055 ssl:default [Connection refused] filename=knowledge_graph.py lineno=161'

  - id: copilot-redis-failed
    title: Copilot Redis errors
    services: [copilot]
    pattern: 'Error (storing value in|getting value from|deleting value from) Redis: '
    severity: warning
    meaning: Copilot cannot read or write its Redis cache, so conversations/state may be lost or slow.
    fix: Check the Redis endpoint and credentials used by copilot and Redis memory/eviction.
    source: copilot/app/clients/redis_client.py:56
    examples:
      - '2026-10-08T10:58:13.551442Z [error    ] Error storing value in Redis: Error 111 connecting to redis:6379. Connection refused. filename=redis_client.py lineno=56'

  - id: copilot-llm-secret-missing
    title: LLM secret not found
    services: [copilot]
    pattern: 'The requested secret \S+ was not found'
    severity: error
    meaning: The AWS Secrets Manager secret holding LLM credentials does not exist or is not visible to copilot's role.
    fix: Check the secret name/region in the LLM config and the IAM role's secretsmanager:GetSecretValue permission.
    source: copilot/app/utils/llm_config_utils.py:254
    examples:
      - '2026-10-08T10:58:13.551442Z [error    ] The requested secret prophecy/llm/openai was not found filename=llm_config_utils.py lineno=254'

  # ---------------------------------------------------------------- sql sandbox (python-sandbox)
  - id: sandbox-agent-llm-unavailable
    title: Agent LLM API unavailable
    services: [sql]
    pattern: 'upstream API (error \d+|connection error) not retried'
    severity: error
    meaning: The AI agent in the SQL sandbox exhausted retries against Anthropic/Bedrock/Vertex (429, 5xx or connection error), so the agent turn failed.
    fix: Check provider status and quota/rate limits for the configured key, and egress from sandbox pods to the provider.
    source: python-sandbox/agent/services/claude_agent.py:1087
    examples:
      - '{"timestamp": "2026-10-08T10:58:13.551442+00:00Z", "service": "agent-websocket", "level": "ERROR", "logger": "agent.services.claude_agent", "message": "upstream API error 429 not retried (cancelled=False, retries_used=3/3)", "module": "claude_agent", "function": "execute_prompt", "line": 1087}'

  - id: sandbox-agent-api-rejected
    title: Agent LLM API rejected request
    services: [sql]
    pattern: '(API rejected the request for session \S+ \(status=|Not retrying .* the API rejected the request itself)'
    severity: error
    meaning: The LLM provider rejected the agent's request (bad key, unknown model, unsupported feature), so agent conversations fail.
    fix: "Check the status code: 401 means credentials, 404 a wrong model id; for Bedrock/Vertex consider ENABLE_TOOL_SEARCH=false."
    source: python-sandbox/agent/services/claude_agent.py:2787
    examples:
      - '{"timestamp": "2026-10-08T10:58:13.551442+00:00Z", "service": "agent-websocket", "level": "ERROR", "logger": "agent.services.claude_agent", "message": "API rejected the request for session s-91a (status=401): ''invalid x-api-key'' — turn ends here, session kept alive", "module": "claude_agent", "function": "_stream", "line": 2787}'

  - id: sandbox-agent-cli-crashed
    title: Agent Claude subprocess crashing
    services: [sql]
    pattern: '(Claude subprocess crashed, max retry attempts reached|Claude subprocess died during streaming|Error creating Claude SDK client: )'
    severity: error
    meaning: The agent's Claude CLI subprocess cannot start or keeps dying in the sandbox, so agent sessions fail.
    fix: Look at the [CLAUDE CLI STDERR] lines just before for the cause (auth, memory, missing binary) and check pod memory limits.
    source: python-sandbox/agent/services/claude_agent.py:1150
    examples:
      - '{"timestamp": "2026-10-08T10:58:13.551442+00:00Z", "service": "agent-websocket", "level": "ERROR", "logger": "agent.services.claude_agent", "message": "Claude subprocess crashed, max retry attempts reached (attempt 3/3)", "module": "claude_agent", "function": "execute_prompt", "line": 1150}'

  - id: sandbox-sql-server-init-failed
    title: SQL sandbox server init failed
    services: [sql]
    pattern: '(Failed to register (schema_analysis|dbt_resolver) blueprint: |schema_analysis_bp is None, cannot register blueprint|dbt resolver environment failed to initialize)'
    severity: error
    meaning: The SQL sandbox server could not load a required component (schema analysis or dbt resolver), so SQL/dbt features in this pod are broken.
    fix: This is an image problem (missing module or dbt install); check the sandbox image tag and roll back if a new image introduced it.
    source: python-sandbox/sandbox/sql/server.py:97
    examples:
      - "[2026-10-08 10:58:13,551]::[ERROR] [NA_session_id] [MainProcess] [MainThread] [server.py:<module>:97]: - Failed to register dbt_resolver blueprint: No module named 'dbt'"

  - id: sandbox-nexus-download-failed
    title: Sandbox package download failed
    services: [sql, sandbox]
    pattern: 'error in downloading package directly from nexus'
    severity: error
    meaning: The sandbox cannot download a package from the Prophecy artifactory (Nexus), so gem/dependency installs fail.
    fix: Check the artifactory pod health and the sandbox's network access to it.
    source: python-sandbox/sandbox/artifactory.py:91
    examples:
      - '[2026-10-08 10:58:13,551]::[ERROR] [s-91a] [MainProcess] [Thread-3] [artifactory.py:download:91]: - error in downloading package directly from nexus'

  # ---------------------------------------------------------------- knowledgegraph (prophecy-knowledge-graph)
  - id: kg-neo4j-unreachable
    title: Knowledge graph cannot reach neo4j
    services: [knowledgegraph]
    pattern: '(Cannot connect to neo4j: |Cannot verify connectivity to neo4j: |error checking neo4j connectivity)'
    severity: error
    meaning: The knowledge-graph service cannot connect to neo4j (down, wrong credentials or DNS), so KG reads/writes and AI context fail.
    fix: Check the neo4j pod, its bolt Service on 7687 and the neo4j credentials configured for knowledgegraph.
    source: prophecy-knowledge-graph/go/pkg/db/neo4j/utils.go:606
    examples:
      - '{"error":"ConnectivityError: dial tcp 10.0.3.17:7687: connect: connection refused","level":"error","time":"2026-10-08T10:58:13.551442918Z","caller":"/app/go/internal/service/health_service.go:43","message":"error checking neo4j connectivity"}'
      - '{"level":"fatal","time":"2026-10-08T10:58:13.551442918Z","caller":"/app/go/pkg/db/neo4j/utils.go:606","message":"Cannot verify connectivity to neo4j: Neo4jError: Neo.ClientError.Security.Unauthorized"}'

  - id: kg-startup-panic
    title: Knowledge graph startup panic
    services: [knowledgegraph]
    pattern: '"message":"Panic Occurred"'
    severity: error
    meaning: The knowledge-graph service hit a fatal init error (config, graph DB, embedding client) and is exiting.
    fix: Read the error and file_line fields on the line and fix that dependency or config, then let the pod restart.
    source: prophecy-knowledge-graph/go/internal/service/app.go:393
    examples:
      - '{"error":"failed to init graph db","function":"main.run","file_line":"app.go:210","level":"error","time":"2026-10-08T10:58:13.551442918Z","message":"Panic Occurred"}'

  - id: kg-embedding-sidecar-down
    title: KG embedding sidecar failing
    services: [knowledgegraph]
    pattern: '(error reaching python service|Max retries \(\d+\) exceeded for batch of size|Failed to load model: )'
    severity: error
    meaning: The Python embedding sidecar in the knowledgegraph pod is down or cannot load its model, so new KG content is not embedded/searchable.
    fix: Check the python container logs in the knowledgegraph pod (model files, memory) and restart the pod.
    source: prophecy-knowledge-graph/go/internal/service/health_service.go:76
    examples:
      - '{"error":"rpc error: code = Unavailable desc = connection refused","level":"error","time":"2026-10-08T10:58:13.551442918Z","caller":"/app/go/internal/service/health_service.go:76","message":"error reaching python service"}'
      - "2026-10-08 16:28:13,551 - knowledgegraph-service - ERROR - ❌ Failed to load model: [Errno 2] No such file or directory: '/models/all-MiniLM-L6-v2'"

  # ---------------------------------------------------------------- neo4j (upstream image)
  - id: neo4j-auth-failed
    title: Neo4j authentication failure
    services: [neo4j, knowledgegraph]
    pattern: '(Neo\.ClientError\.Security\.Unauthorized|The client is unauthorized due to authentication failure)'
    severity: error
    meaning: knowledgegraph is connecting to neo4j with a password that neo4j does not accept (often after a neo4j volume reset or secret rotation).
    fix: Make the neo4j auth secret and the knowledgegraph neo4j password match, then restart knowledgegraph.
    source: ""
    examples:
      - '2026-10-08 10:58:13.551+0000 WARN  [bolt-12] The client is unauthorized due to authentication failure.'

  - id: neo4j-start-failed
    title: Neo4j failed to start
    services: [neo4j]
    pattern: '(Failed to start Neo4j|Unable to start database|Error starting org\.neo4j)'
    severity: error
    meaning: The neo4j server could not start (store lock, corrupt store, bad config or memory settings) and the knowledge graph is down.
    fix: Read the cause in the following lines; check the data PVC (lock files, free space) and memory settings vs the pod limit.
    source: ""
    examples:
      - '2026-10-08 10:58:13.551+0000 ERROR Failed to start Neo4j on 0.0.0.0:7474.'
